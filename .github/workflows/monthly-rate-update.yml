name: Monthly rate update

# Fetches the free official sources (ECB forex, World Bank price index) on the 1st of every month and opens a pull request
# with the new DRAFT rates. Nothing is approved automatically: review and approve them on the Rates page after merging.
# Needs: Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
on:
  schedule:
    - cron: "17 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch rates (a failing source is logged and skipped)
        run: python -m backend.app.rate_update
      - name: Country rate book (one Excel per country, 24 months, with sources)
        continue-on-error: true
        run: python -m backend.app.country_rate_book --out country_rates
      - name: Attach the country rate book to this run (Actions → this run → Artifacts)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: country-rate-book-${{ github.run_number }}
          path: country_rates/
          retention-days: 90
      - name: Open a pull request with the drafts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- master_data/costing_db.sqlite; then echo "No new rates."; exit 0; fi
          branch="rate-update-$(date +%Y-%m)"
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout -b "$branch"
          git add master_data/costing_db.sqlite
          git commit -m "Monthly rate update $(date +%Y-%m): new draft rates"
          git push -u origin "$branch"
          gh pr create --title "Monthly rate update $(date +%Y-%m)" --body "New DRAFT rates (forex from the ECB, price-index proposals from the World Bank). Merge, then review and approve them on the Rates page → Rate review. See the update log there for sources that failed."
