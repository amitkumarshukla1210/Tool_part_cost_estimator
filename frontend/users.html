<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Design to Cost — Users</title>
  <link rel="icon" type="image/png" href="/theme/logo.png" />
  <link rel="stylesheet" href="/theme/dtc-theme.css" />
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="/static/register.css" />
</head>
<body>
  <header><div class="header-inner"><a class="brand" href="/"><img src="/theme/logo.png" alt="Design to Cost logo" />
    <span class="brand-text"><span class="name">Design to Cost</span><span class="tagline">Part Cost Estimator</span></span></a>
    <nav><ul><li><a href="/dashboard">Dashboard</a></li><li><a href="/users" class="active" aria-current="page">Users</a></li></ul></nav></div></header>
  <main>
    <section class="page-body"><div class="container">
      <h2>Users and roles</h2>
      <p class="note">viewer: read · engineer: + change projects, parts, costs, master data · approver: + approve rates · admin: + manage users.</p>
      <form class="card grid2" id="newUser">
        <label>User name <input name="username" required /></label><label>Full name <input name="name" /></label>
        <label>Role <select name="role"><option>viewer</option><option selected>engineer</option><option>approver</option><option>admin</option></select></label>
        <label>Password (10+ characters) <input type="password" name="password" required minlength="10" autocomplete="new-password" /></label>
        <div class="span2 dialog-actions"><button class="btn btn-primary" type="submit">Add user</button></div>
        <p class="status span2" id="status"></p>
      </form>
      <div class="table-wrap"><table class="cost-table" id="users"></table></div>
      <form class="card grid2" id="pwForm"><h3 class="span2">Change my password</h3>
        <label>Old password <input type="password" name="old" autocomplete="current-password" /></label>
        <label>New password <input type="password" name="new" minlength="10" autocomplete="new-password" /></label>
        <div class="span2 dialog-actions"><button class="btn btn-outline" type="submit">Change password</button></div></form>
    </div></section>
  </main>
  <script src="/static/common.js"></script>
  <script>
    const { $, esc, api, status } = window.DTC;
    async function load() {
      const users = await api("/api/users");
      $("users").innerHTML = `<thead><tr><th>User</th><th>Name</th><th>Role</th><th>Active</th><th>Last login</th><th>New password</th><th></th></tr></thead><tbody>${users.map((u) => `<tr data-id="${u.id}">
        <td>${esc(u.username)}</td><td><input data-f="name" value="${esc(u.name)}" /></td>
        <td><select data-f="role">${["viewer", "engineer", "approver", "admin"].map((r) => `<option ${r === u.role ? "selected" : ""}>${r}</option>`).join("")}</select></td>
        <td><input type="checkbox" data-f="active" ${u.active ? "checked" : ""} /></td><td>${esc(u.last_login || "—")}</td>
        <td><input type="password" data-f="password" placeholder="leave empty" autocomplete="new-password" /></td><td><button class="btn btn-outline small" data-save>Save</button></td></tr>`).join("")}</tbody>`;
    }
    $("users").addEventListener("click", async (e) => {
      if (!e.target.matches("[data-save]")) return;
      const tr = e.target.closest("tr"), data = {};
      tr.querySelectorAll("[data-f]").forEach((el) => { data[el.dataset.f] = el.type === "checkbox" ? el.checked : el.value; });
      if (!data.password) delete data.password;
      try { await api(`/api/users/${tr.dataset.id}`, { method: "PUT", body: JSON.stringify(data) }); status($("status"), "Saved.", "ok"); load(); }
      catch (err) { status($("status"), err.message, "error"); }
    });
    $("newUser").addEventListener("submit", async (e) => {
      e.preventDefault();
      try { await api("/api/users", { method: "POST", body: JSON.stringify(Object.fromEntries(new FormData(e.target))) }); e.target.reset(); load(); status($("status"), "User added.", "ok"); }
      catch (err) { status($("status"), err.message, "error"); }
    });
    $("pwForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      try { await api("/api/auth/password", { method: "POST", body: JSON.stringify(Object.fromEntries(new FormData(e.target))) }); e.target.reset(); status($("status"), "Password changed.", "ok"); }
      catch (err) { status($("status"), err.message, "error"); }
    });
    load();
  </script>
</body>
</html>
